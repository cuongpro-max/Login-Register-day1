server.port=${SERVER_PORT:8080}

# Cấu hình Database đọc từ file .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/login_demo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate tự động cập nhật bảng users và refresh_tokens
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cấu hình JWT đọc từ file .env
jwt.secret=${JWT_SECRET:day-la-chuoi-secret-key-rat-dai-va-an-toan-cho-jwt-32bytes-123456}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
